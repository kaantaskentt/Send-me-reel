name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-build:
    name: Clean hosted build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # No root npm install here: Vercel's Root Directory is web.
      - run: npm run check:hosted

  verification:
    name: Tests, worker and companion types, web lint
    needs: hosted-build
    # Playwright supports 22.04. Newer Ubuntu runner AppArmor defaults block
    # Chromium's user namespace; keep the companion's chromiumSandbox enabled.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Exercise the real offline metadata-template regression instead of
      # silently skipping it on runners without the Mac media runtime.
      - run: python -m pip install --disable-pip-version-check yt-dlp==2026.3.17
      - run: npm test
      - run: npm run build
      - run: npm run check:companion
      - run: npm --prefix web run lint
